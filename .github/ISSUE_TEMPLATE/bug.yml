name: Bug
description: Something behaves differently from what the contract or documentation says.
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The observed behaviour, with the command and its actual output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: Cite the contract, schema, or document that says so, if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The smallest sequence that shows it. Say so plainly if it is intermittent.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: 69fefa7 / alpha-v0.1
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This may be exploitable — I have read SECURITY.md and will report privately instead if so

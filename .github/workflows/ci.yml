name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check whitespace
        run: git diff --check

      - name: Compile entrypoints
        run: python -m py_compile steel-mission-chat/server.py bin/present-worker bin/present-control-plane bin/present-evidence-signer

      - name: Run tests
        run: python -m pytest

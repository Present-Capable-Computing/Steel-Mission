name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install mocked provider probes
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/claude" <<'SH'
          #!/usr/bin/env sh
          if [ "$1" = "auth" ] && [ "$2" = "status" ]; then
            printf '{"loggedIn":true,"authMethod":"ci-mock","apiProvider":"ci"}\n'
            exit 0
          fi
          printf 'ci mock claude only supports auth status\n' >&2
          exit 2
          SH
          cat > "$HOME/.local/bin/codex" <<'SH'
          #!/usr/bin/env sh
          if [ "$1" = "login" ] && [ "$2" = "status" ]; then
            printf 'CI mock Codex authenticated\n'
            exit 0
          fi
          printf 'ci mock codex only supports login status\n' >&2
          exit 2
          SH
          chmod +x "$HOME/.local/bin/claude" "$HOME/.local/bin/codex"

      - name: Check whitespace
        run: git diff --check

      - name: Compile entrypoints
        run: make compile-entrypoints PYTHON=python

      - name: Run tests
        run: python -m pytest

  ui-build:
    name: UI build is reproducible
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Audit high-severity dependencies
        run: npm audit --audit-level=high

      - name: Type-check the application
        run: npm run ui:typecheck

      - name: Run front-end unit tests
        run: npm run ui:test

      - name: Compare the committed page with a clean rebuild
        run: npm run ui:check

      - name: Prove edited generated output is rejected
        run: |
          cp steel-mission-chat/app.html "$RUNNER_TEMP/steel-mission-app.html"
          printf '\n<!-- deliberate rebuild drift -->\n' >> steel-mission-chat/app.html
          if npm run ui:check; then
            printf 'ui:check must reject an edited committed page\n' >&2
            exit 1
          fi
          mv "$RUNNER_TEMP/steel-mission-app.html" steel-mission-chat/app.html
          npm run ui:check
          git diff --exit-code -- steel-mission-chat/app.html

  engineering-style:
    name: engineering-style
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Vale
        run: |
          # A user-writable directory, not /usr/local/bin: the hosted image
          # happens to make that runner-writable today, but nothing promises it.
          mkdir -p "$HOME/.local/bin"
          curl -sfL https://github.com/errata-ai/vale/releases/download/v3.17.1/vale_3.17.1_Linux_64-bit.tar.gz \
            | tar -xz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # One shared gate: this is the same `make style-check` a contributor runs
      # locally inside `make release-check`. Scope (from .vale.ini): Markdown
      # prose (README, CONTRIBUTING, AGENTS.md, docs/, plan/, .github Markdown),
      # Python comments, whole Python files for the em-dash ban (docstrings
      # included, via git grep in the target), and .github YAML templates and
      # workflows;
      # never LICENSE.md or CODE_OF_CONDUCT.md, which carry fixed legal wording.
      # Commit messages and PR descriptions are not in the checkout; review
      # enforces those. See Present/engineering/STYLE.md for the rule set.
      - name: Vale (engineering prose style)
        run: make style-check

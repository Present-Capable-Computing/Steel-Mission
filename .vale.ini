StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Present

Packages = Google

# Explicit include-scope, not an exclude-list (see Present/engineering/STYLE.md's
# Baseline section for why): legal/boilerplate text (LICENSE.md, LICENSE,
# NOTICE, CODE_OF_CONDUCT.md's Contributor Covenant text) is never linted.
# Widen this list only when a directory holds engineering prose a developer
# reads while working, not by flipping to "everything except legal files".
[{README.md,CONTRIBUTING.md,INSTALL.md,RELEASE_NOTES.md,SECURITY.md,architecture.md,operations.md,AGENTS.md,docs/**/*.md,plan/**/*.md,.github/**/*.md}]
BasedOnStyles = Vale, Google, Present
# No em dashes anywhere: Present.NoEmDash (error) bans the character
# outright. Google.EmDash (spacing-only) is redundant under that ban and
# left enabled for defense in depth.
# Casing-consistency checking fights lowercase directory-name-style headings
# against normal acronym casing in running prose (see Present's own .vale.ini).
Vale.Terms = NO
# "14B"/"7B" is standard ML model-size notation (14 billion parameters), not
# a number-unit pair missing a nonbreaking space.
Google.Units = NO
# "exactly-once", "immediately-invoked" (as in IIFE) are fixed compound
# technical terms in distributed systems / JS, not generic "-ly" adverb misuse.
Google.LyHyphens = NO
